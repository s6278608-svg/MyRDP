name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Configure Network and DNS
        shell: powershell
        run: |
          Write-Host "=== Network configuration ==="

          # Clear DNS cache
          ipconfig /flushdns

          # Reset WinHTTP proxy
          netsh winhttp reset proxy

          # Reset Winsock
          netsh winsock reset

          # Prefer IPv4
          New-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters" `
            -Name "DisabledComponents" `
            -PropertyType DWord `
            -Value 0x20 `
            -Force | Out-Null

          # Configure public DNS on active adapters
          $adapters = Get-NetAdapter |
            Where-Object {
              $_.Status -eq "Up" -and
              $_.Virtual -eq $false
            }

          foreach ($adapter in $adapters) {
              Write-Host "Configuring DNS on $($adapter.Name)"

              try {
                  Set-DnsClientServerAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -ServerAddresses @("1.1.1.1","8.8.8.8")
              }
              catch {
                  Write-Host "DNS configuration failed on $($adapter.Name)"
              }
          }

          ipconfig /flushdns

          Write-Host "=== DNS ==="
          Get-DnsClientServerAddress -AddressFamily IPv4 |
            Format-Table -AutoSize

          Write-Host "=== Proxy ==="
          netsh winhttp show proxy

      - name: Create RDP User
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_CREDS=User: RDP | Password: $password" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
              $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()

              if ($tsIP -match '^\d+\.\d+\.\d+\.\d+$') {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify Network
        shell: powershell
        run: |
          Write-Host "=== Testing DNS ==="

          try {
              Resolve-DnsName google.com -ErrorAction Stop |
                Select-Object -First 3 |
                Format-Table
          }
          catch {
              Write-Host "DNS test failed: $($_.Exception.Message)"
          }

          Write-Host "=== Testing HTTPS ==="

          try {
              $response = Invoke-WebRequest `
                -Uri "https://www.google.com" `
                -UseBasicParsing `
                -TimeoutSec 15

              Write-Host "HTTPS status: $($response.StatusCode)"
          }
          catch {
              Write-Host "HTTPS test failed: $($_.Exception.Message)"
          }

          Write-Host "=== Testing RDP ==="

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP connectivity successful."

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================="
          Write-Host "       RDP ACCESS"
          Write-Host "=============================="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(($env:RDP_CREDS -split '\|')[1].Trim())"
          Write-Host "=============================="
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
